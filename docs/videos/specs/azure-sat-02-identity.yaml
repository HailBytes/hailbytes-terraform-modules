# Chapter 2 of the Azure SAT series. Narration and on-screen text: ../azure/SCRIPT.md.
id: azure-sat-02-identity
cloud: azure
product: sat
chapter: 2
title: The deploying identity
steps:
  - type: title
    eyebrow: Chapter 2 of 5
    headline: The deploying identity
    sub: What it needs once, what it needs every time, and running the deployment as a service principal.
    narration: >-
      The identity that runs the deployment needs two different sets of rights: a one-time set
      for the subscription, and a smaller set for every deployment after that.

  - type: card
    eyebrow: Once per subscription
    headline: Owner, for the prep you did in chapter 1
    bullets:
      - "Registering resource providers is a subscription-scoped write"
      - "Accepting the Marketplace terms is too"
      - "An Owner runs `preflight-azure.sh --accept-terms` once, and is done"
      - "Nobody needs to hold Owner after that"
    narration: >-
      Registering resource providers and accepting the Marketplace terms both write at
      subscription scope. An Owner does it once, with the preflight from chapter one.
      Nobody has to keep holding Owner for this afterwards.

  - type: card
    eyebrow: Every deployment
    headline: Contributor plus User Access Administrator
    bullets:
      - "Contributor creates the VMs, network, database and Key Vault"
      - "The modules also create role assignments: each VM reads its secrets from Key Vault"
      - "Contributor cannot create role assignments. User Access Administrator can"
      - "Scope both to the subscription: the quickstart creates its own resource group"
    narration: >-
      For every deployment, Contributor creates the resources. But the modules also create
      role assignments, so each VM can read its database password from Key Vault, and
      Contributor cannot do that. Add User Access Administrator. Without it, the apply fails
      late, after the VMs already exist.

  - type: terminal
    session:
      - say: >-
          Here is a service principal with exactly that pair. Many teams prefer this to a person's
          account: the deployment keeps working when people change roles.
      - cmd: SUB=$(az account show --query id -o tsv)
      - cmd: az ad sp create-for-rbac --name sp-hailbytes-deploy --role Contributor --scopes /subscriptions/$SUB
      - out: |
          Creating 'Contributor' role assignment under scope '/subscriptions/00000000-0000-0000-0000-000000000000'
          The output includes credentials that you must protect. Be sure that you do not include these
          credentials in your code or check the credentials into your source control.
          {
            "appId": "22222222-2222-2222-2222-222222222222",
            "displayName": "sp-hailbytes-deploy",
            "password": "****************************************",
            "tenant": "00000000-0000-0000-0000-000000000000"
          }
      - say: >-
          Store the password in your secrets manager now. Azure shows it once.
      - cmd: az role assignment create --assignee 22222222-2222-2222-2222-222222222222 --role "User Access Administrator" --scope /subscriptions/$SUB --query roleDefinitionName -o tsv
      - out: |
          User Access Administrator

  - type: terminal
    session:
      - say: >-
          To run as the service principal, sign in with it and export four variables. Terraform reads
          them directly. Nothing is written to disk, and HailBytes never sees them.
      - cmd: export ARM_CLIENT_ID=22222222-2222-2222-2222-222222222222 ARM_TENANT_ID=00000000-0000-0000-0000-000000000000 ARM_SUBSCRIPTION_ID=$SUB
      - cmd: 'read -rsp ''Client secret: '' ARM_CLIENT_SECRET && export ARM_CLIENT_SECRET && echo'
      - out: |
          Client secret:
      - cmd: az login --service-principal -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" --tenant "$ARM_TENANT_ID" -o none
      - cmd: az account show --query '{name:name, user:user.name}' -o table
      - out: |
          Name            User
          --------------  ------------------------------------
          HailBytes Demo  22222222-2222-2222-2222-222222222222
      - say: >-
          Read the secret with read dash s rather than typing it on the command line, so it stays
          out of your shell history.

  - type: card
    eyebrow: The consequence people miss
    headline: Whoever runs the apply holds the Key Vault
    bullets:
      - "The deploying identity is granted Key Vault Secrets Officer on the deployment's vault"
      - "That vault holds the database password, the shared session keys and the first admin password"
      - "Deploy as a service principal and no person can read them"
      - "Fix it at deploy time: `key_vault_reader_principal_ids = [\"<Entra group object id>\"]`"
    narration: >-
      One consequence is easy to miss. Whoever runs the apply is granted the deployment's Key Vault,
      and nobody else is. Run it as a service principal and, at three in the morning, your operators
      have to borrow its credentials. Grant an Entra group at deploy time instead.

  - type: terminal
    session:
      - say: >-
          Use a group, not named people, so membership can change without a redeploy. This is the
          object ID the variable takes.
      - cmd: az ad group show --group "SAT Operators" --query id -o tsv
      - out: |
          11111111-1111-1111-1111-111111111111
      - say: >-
          Note it down. It goes into terraform dot tfvars in chapter three.

  - type: card
    eyebrow: In short
    headline: Two roles, two times
    bullets:
      - "Once, by an Owner: `preflight-azure.sh <tier> --product sat --accept-terms`"
      - "Every deployment: Contributor + User Access Administrator, at subscription scope"
      - "Service principal? Put an operators group in `key_vault_reader_principal_ids`"
    narration: >-
      So: an Owner once, for the providers and the terms. Contributor and User Access
      Administrator for every deployment. And if a service principal deploys, an operators group
      in key vault reader principal IDs. Next, chapter three: the deployment itself.
