# Chapter 2 of the AWS SAT series. Narration and on-screen text: ../aws/SCRIPT.md.
# Follows docs/AWS_MSSP_RUNBOOK.md, Steps 3-7. Counts and timings are illustrative.
id: aws-sat-02-deploy
cloud: aws
product: sat
chapter: 2
title: Deploy HailBytes SAT on AWS
steps:
  - type: title
    eyebrow: Chapter 2 of 4
    headline: Deploy HailBytes SAT on AWS
    sub: Two instances in two Availability Zones behind a load balancer, with a managed PostgreSQL database.
    narration: >-
      Now the deployment itself: the HA tier, with two instances across two Availability Zones, a load
      balancer in front, and RDS PostgreSQL behind them, from AWS CloudShell.

  - type: terminal
    session:
      - say: >-
          Give each client its own working directory, then move Terraform state into S3. State left in
          CloudShell also holds generated passwords, and should not live there.
      - cmd: export CUSTOMER=acme AWS_REGION=us-east-1
      - cmd: git clone --depth 1 https://github.com/HailBytes/hailbytes-terraform-modules ~/hailbytes/$CUSTOMER
      - out: |
          Cloning into '/home/cloudshell-user/hailbytes/acme'...
      - cmd: cd ~/hailbytes/$CUSTOMER/quickstart/aws-sat-ha
      - cmd: ../bootstrap-state-aws.sh --out . --region "$AWS_REGION" --key "clients/$CUSTOMER/sat-ha.tfstate"
      - out: |
          Terraform state backend
                  account  123456789012
                  region   us-east-1
                  bucket   hailbytes-tfstate-123456789012-us-east-1
                  key      clients/acme/sat-ha.tfstate
            ok    created bucket hailbytes-tfstate-123456789012-us-east-1
            ok    public access blocked
            ok    ACLs disabled
            ok    versioning on
            ok    encryption at rest on
            ok    TLS-only policy applied
            ok    wrote ./backend.tf
      - say: >-
          The first client in an account and region creates the bucket. Every later client reuses it, and
          only the key changes.

  - type: terminal
    session:
      - say: >-
          Now the settings. Set customer on the very first apply: it prefixes every name and tags every
          resource, and changing it later replaces everything.
      - cmd: cp terraform.tfvars.example terraform.tfvars && nano terraform.tfvars
      - cmd: cat terraform.tfvars
      - out: |
          customer            = "acme"
          region              = "us-east-1"
          allowed_cidrs       = ["203.0.113.10/32"]   # who may reach the ADMIN console
          phish_allowed_cidrs = ["0.0.0.0/0"]         # who may reach the landing pages
      - say: >-
          Set phish allowed CIDRs separately. The simulation targets are not in your admin range, and
          without it the campaign sends but records no clicks.
      - pause: 1
      - say: >-
          Sizing: the default is eight vCPUs per instance, so sixteen metered across the pair. Every vCPU
          meters 24 cents an hour, so set instance type from the load you expect.

  - type: terminal
    session:
      - say: >-
          Initialise, write the plan to a file, and read it. Every name should start with acme dash sat,
          and nothing should be planned for destroy.
      - cmd: terraform init
      - out: |
          Initializing the backend...
          {g}Successfully configured the backend "s3"!{/} Terraform will automatically
          use this backend unless the backend configuration changes.
          {d}  ...{/}
          {g}Terraform has been successfully initialized!{/}
      - cmd: terraform plan -out tfplan
      - out: |
          {d}  ...{/}
            # module.hailbytes_sat.aws_db_instance.main will be created
            # module.hailbytes_sat.aws_instance.vm[0] will be created
            # module.hailbytes_sat.aws_instance.vm[1] will be created
            # module.hailbytes_sat.aws_lb.main will be created
          {d}  ...{/}

          {b}Plan:{/} 84 to add, 0 to change, 0 to destroy.

  - type: terminal
    session:
      - say: >-
          Apply the saved plan, keeping a log. The database is the long pole: a Multi-AZ RDS instance takes
          a while to create.
      - cmd: terraform apply tfplan 2>&1 | tee apply.log
      - out: |
          module.network.aws_vpc.main: Creating...
          module.network.aws_vpc.main: Creation complete after 2s
          module.network.aws_nat_gateway.main[0]: Still creating... [1m40s elapsed]
          module.hailbytes_sat.aws_db_instance.main: Creating...
          module.hailbytes_sat.aws_db_instance.main: Still creating... [10m0s elapsed]
          module.hailbytes_sat.aws_db_instance.main: Creation complete after 14m22s
          module.hailbytes_sat.aws_instance.vm[0]: Creating...
          module.hailbytes_sat.aws_instance.vm[1]: Creating...
          module.hailbytes_sat.aws_instance.vm[0]: Creation complete after 13s
          module.hailbytes_sat.aws_instance.vm[1]: Creation complete after 13s
          {d}  ...{/}

          {g}{b}Apply complete! Resources: 84 added, 0 changed, 0 destroyed.{/}

          Outputs:

          backup_bucket_name = "acme-sat-prod-backup-123456789012"
          console_url = "https://acme-sat-prod-alb-1234567890.us-east-1.elb.amazonaws.com/"
          initial_credentials_command = "aws secretsmanager get-secret-value --region us-east-1 --secret-id arn:aws:secretsmanager:us-east-1:123456789012:secret:acme-sat-prod-admin-initial-password-AbCdEf --query SecretString --output text"
      - say: >-
          The instance launch is the moment a missing Marketplace subscription would fail with
          OptInRequired, which is why chapter one comes first.

  - type: card
    eyebrow: If the apply stops
    headline: Read the log before you re-run anything
    bullets:
      - "`../explain.sh apply.log` names the cause, who can fix it, and the exact command"
      - "Re-running the same apply after the fix is safe: Terraform picks up where it stopped"
      - "Don't rename things to get past an error"
    narration: >-
      If the apply stops, don't re-run it blindly and don't change names to get past it. Run explain
      dot s h on the log. It names the cause and the fix, and re-running the same apply afterwards is safe.

  - type: terminal
    session:
      - say: >-
          Now check it is serving. Allow a few minutes after the apply for the instances to finish booting.
          Then print the first-boot admin password: both instances share it through Secrets Manager.
      - cmd: URL=$(terraform output -raw console_url)
      - cmd: curl -sk -o /dev/null -w '%{http_code}\n' "${URL}api/health"
      - out: |
          200
      - cmd: eval "$(terraform output -raw initial_credentials_command)"
      - out: |
          ****************

  - type: card
    eyebrow: First sign-in
    headline: Sign in once, then change the password
    bullets:
      - "Browse to the console URL. It serves a self-signed certificate until chapter 3"
      - "Sign in as `admin` with the password you just printed"
      - "Change it at once. The first-boot password is history after that"
    narration: >-
      Browse to the console URL. Until you add your own certificate in chapter three, it is self-signed,
      so expect a browser warning. Sign in as admin, and change the password straight away.

  - type: card
    eyebrow: Next
    headline: "Chapter 3: DNS, a certificate and operator access"
    bullets:
      - "Your hostname on the load balancer"
      - "An ACM certificate in place of the self-signed one"
      - "Secrets and shell access for your operators"
    narration: >-
      SAT is running. Next we put it on your own hostname with a trusted certificate, and give your
      operators access without sharing the deploying identity.
