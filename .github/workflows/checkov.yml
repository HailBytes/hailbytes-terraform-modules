name: checkov

on:
  pull_request:
    paths:
      - 'modules/**'
      - '.github/workflows/checkov.yml'
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  checkov:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Checkov on Terraform modules
        uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085 # v12
        with:
          directory: modules/
          framework: terraform
          # Skip list, suppression rationale, and category breakdown
          # live in .checkov.yaml at the repo root. Every entry there
          # carries a one-line reason in a comment; PRs that add new
          # suppressions without rationale are rejected at review.
          config_file: .checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false
          quiet: true

      - name: Upload Checkov SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v3.27.5
        with:
          sarif_file: checkov.sarif
          category: checkov
